[package]
name = "flulens"
version = "0.1.0"
edition = "2021"
description = "FluLens — flu variant viewer"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "FluLens"
path = "src/main.rs"
