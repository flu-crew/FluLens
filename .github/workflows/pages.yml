# Publishes the browser build to GitHub Pages.
#
# Three things land on the site:
#   /                              the app, empty, waiting for you to pick a run
#   /?run=example_run              auto-loaded with the synthetic Flumina example
#   /?run=example_run_nanopore     auto-loaded with the synthetic FluPore example
#
# One copy of the HTML serves all three — the app reads a `?run=` parameter.
# Each example needs manifest.json because Pages serves no directory index; see
# tools/make_manifest.py for why that matters.
name: Pages

# Deliberately NOT path-filtered. A `paths:` list looks like an optimisation and
# behaves like a trap: on a force-push GitHub evaluates it against a `before`
# commit that is no longer in the history, and the run is silently skipped. Three
# pushes in a row deployed nothing that way, and the only symptom was the live
# site quietly serving an older build — which reads as a broken app, not a
# missing deploy. The whole site is one HTML file; the run takes about 30 s.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        run: |
          mkdir -p _site
          cp flulens.html _site/index.html
          cp -R example_run _site/example_run
          rm -f _site/example_run/README.md
          python3 tools/make_manifest.py _site/example_run
          cp -R example_run_nanopore _site/example_run_nanopore
          rm -f _site/example_run_nanopore/README.md
          python3 tools/make_manifest.py _site/example_run_nanopore
          # Also offer the single file as a download, so someone who wants it
          # offline does not have to clone the repository.
          cp flulens.html _site/flulens.html

      # enablement: true switches Pages on for the repository rather than failing
      # when it is off. Without it the first run dies with "Get Pages site failed …
      # verify that the repository has Pages enabled", which reads like a broken
      # workflow instead of a one-time setting. It cannot rescue a PRIVATE repo on
      # a free plan, though — Pages is unavailable there at any setting.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
